name: GohanKuji
options:
  bundleIdPrefix: com.nasa9084
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  GohanKuji:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: FortuneWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.gohankuji
        CODE_SIGN_ENTITLEMENTS: Entitlements/GohanKuji.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GohanKuji
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  FortuneWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        # SideStore は App ID 名にこの名前を使うので英数字にしておく
        CFBundleDisplayName: Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.gohankuji.FortuneWidget
        CODE_SIGN_ENTITLEMENTS: Entitlements/FortuneWidget.entitlements
